name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run verify

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Links Workplace ${{ github.ref_name }}
          releaseBody: |
            ### Links Workplace

            Links Workplace 是 NTU Course Assistant 的后续版本。本次构建资产仅用于对应版本的验收；请以 Release 页面提供的版本说明为准。

            Windows 构建目前未进行 Authenticode 商业代码签名，可能显示未知发布者或 SmartScreen 提示。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true

      - name: Normalize signed updater download URLs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'release-updater'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download $env:GITHUB_REF_NAME --pattern 'latest.json' --dir $dir
          if ($LASTEXITCODE -ne 0) { throw 'Could not download updater manifest' }
          $assetsFile = Join-Path $dir 'release-assets.json'
          gh release view $env:GITHUB_REF_NAME --json assets | Out-File -FilePath $assetsFile -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Could not read release assets' }
          $manifestFile = Join-Path $dir 'latest.json'
          node scripts/normalize-updater-manifest.mjs $manifestFile $assetsFile $env:GITHUB_REPOSITORY $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Invalid updater manifest' }
          gh release upload $env:GITHUB_REF_NAME $manifestFile --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload normalized updater manifest' }
