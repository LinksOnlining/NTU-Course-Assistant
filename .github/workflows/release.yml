name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run verify

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NTU Course Assistant ${{ github.ref_name }}
          releaseBody: |
            NTU Course Assistant ${{ github.ref_name }}

            这次更新加入了完整的 Academic Hub。

            新功能：
            - 单次停课、调课、换教室、补课和撤销变化
            - 学习事项与考试管理
            - Today 学习中心与升级后的课程提醒
            - Widget NEXT / DEADLINES 模式
            - 学期归档与历史查看

            界面与稳定性：
            - 统一 Academic Hub 页面布局和滚动体验
            - 修复课程变化状态泄漏与操作长期 Busy
            - 完成 Windows 10 安装态人工回归验证

            首选下载 NSIS setup.exe；当前版本未进行 Windows Authenticode 商业代码签名。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
